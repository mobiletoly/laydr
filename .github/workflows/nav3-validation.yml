name: Nav3 lifecycle and consumer compatibility

on:
  pull_request:
    paths: &nav3_paths
      - 'laydr-nav3-*/**'
      - 'laydr-nav-runtime/**'
      - 'laydr-compose/**'
      - 'laydr-core/**'
      - 'laydr-codegen/**'
      - 'laydr-gradle-plugin/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'verification/nav3-consumer/**'
      - 'scripts/check-nav3-consumers.sh'
      - '.github/workflows/nav3-validation.yml'
  push:
    branches: [main]
    paths: *nav3_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nav3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-and-consumers:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check desktop navigation and plugin behavior
        run: ./gradlew :conventions:test :laydr-nav-runtime:jvmTest :laydr-nav3-kmp:jvmTest :laydr-gradle-plugin:check --no-configuration-cache
      - name: Check isolated published-artifact consumers
        run: ./scripts/check-nav3-consumers.sh
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav3-desktop-consumers
          path: |
            laydr-nav3-kmp/build/reports/tests/
            laydr-gradle-plugin/build/reports/tests/
            build/nav3-validation/
            build/nav3-consumers.*/*.log
            build/nav3-consumers.*/**/build/reports/

  androidx-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run AndroidX unit and API 36 Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: ./gradlew :laydr-nav3-androidx:testDebugUnitTest :laydr-nav3-androidx:connectedDebugAndroidTest --no-configuration-cache
      - name: Upload AndroidX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav3-androidx-ui
          path: |
            laydr-nav3-androidx/build/reports/
            laydr-nav3-androidx/build/outputs/androidTest-results/
