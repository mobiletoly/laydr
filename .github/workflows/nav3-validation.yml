name: Nav3 lifecycle and consumer compatibility

on:
  pull_request:
    paths: &nav3_paths
      - 'laydr-nav3-*/**'
      - 'laydr-nav-runtime/**'
      - 'laydr-compose/**'
      - 'laydr-core/**'
      - 'laydr-codegen/**'
      - 'laydr-gradle-plugin/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'verification/nav3-consumer/**'
      - 'scripts/check-nav3-consumers.sh'
      - 'scripts/select-nav3-ci.py'
      - 'scripts/tests/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths: *nav3_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nav3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      consumer_matrix: ${{ steps.select.outputs.consumer_matrix }}
      android_ui: ${{ steps.select.outputs.android_ui }}
      plugin_checks: ${{ steps.select.outputs.plugin_checks }}
      publishing_checks: ${{ steps.select.outputs.publishing_checks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test CI gate selection
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Select validation gates
        id: select
        run: python3 -B scripts/select-nav3-ci.py

  desktop-checks:
    needs: plan
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle dependencies and builds
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Check desktop navigation
        run: ./gradlew :laydr-nav-runtime:jvmTest :laydr-nav3-kmp:jvmTest --no-configuration-cache --build-cache
      - name: Check generator and plugin behavior
        if: needs.plan.outputs.plugin_checks == 'true'
        run: ./gradlew :laydr-codegen:test :laydr-gradle-plugin:check --no-configuration-cache --build-cache
      - name: Check publishing conventions
        if: needs.plan.outputs.publishing_checks == 'true'
        run: ./gradlew :conventions:test --no-configuration-cache --build-cache
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nav3-desktop-checks
          path: |
            laydr-nav3-kmp/build/reports/tests/
            laydr-nav-runtime/build/reports/tests/
            laydr-codegen/build/reports/tests/
            laydr-gradle-plugin/build/reports/tests/
            build-logic/conventions/build/reports/tests/

  consumers:
    needs: plan
    name: Consumers (${{ matrix.kotlin }}, ${{ matrix.scope }})
    runs-on: macos-26
    timeout-minutes: ${{ matrix.scope == 'full' && 40 || 25 }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.consumer_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle dependencies and builds
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Cache Kotlin Native dependencies
        if: matrix.scope == 'full'
        uses: actions/cache@v6
        with:
          path: ~/.konan/dependencies
          key: nav3-native-deps-${{ runner.os }}-${{ runner.arch }}-macos-26-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Check isolated published-artifact consumer
        env:
          CONSUMER_KOTLIN: ${{ matrix.kotlin }}
          CONSUMER_SCOPE: ${{ matrix.scope }}
        run: ./scripts/check-nav3-consumers.sh "--scope=$CONSUMER_SCOPE" "$CONSUMER_KOTLIN"
      - name: Upload consumer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nav3-consumer-${{ matrix.kotlin }}-${{ matrix.scope }}
          path: |
            build/nav3-validation/
            build/nav3-consumers.*/*.log
            build/nav3-consumers.*/scope.txt
            build/nav3-consumers.*/selected-compilers.txt
            build/nav3-consumers.*/consumer-versions.tsv
            build/nav3-consumers.*/**/build/reports/

  androidx-ui:
    needs: plan
    if: needs.plan.outputs.android_ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle dependencies and builds
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run AndroidX unit and API 36 Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: ./gradlew :laydr-nav3-androidx:testDebugUnitTest :laydr-nav3-androidx:connectedDebugAndroidTest --no-configuration-cache --build-cache
      - name: Upload AndroidX evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nav3-androidx-ui
          path: |
            laydr-nav3-androidx/build/reports/
            laydr-nav3-androidx/build/outputs/androidTest-results/
